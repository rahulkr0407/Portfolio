@if (palette.open()) {
  <div class="palette">
    <button
      type="button"
      class="palette__backdrop"
      aria-label="Close command palette"
      (click)="close()"
    ></button>
    <div class="palette__panel" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette__search">
        <app-icon name="terminal" [size]="18" />
        <input
          #search
          class="palette__input"
          type="text"
          placeholder="Search sections and actions…"
          role="combobox"
          aria-expanded="true"
          aria-controls="palette-list"
          [attr.aria-activedescendant]="activeDescendant()"
          [value]="query()"
          (input)="onInput($event)"
          (keydown)="onListKey($event)"
        />
        <kbd class="palette__kbd">esc</kbd>
      </div>

      <div class="palette__list" id="palette-list" role="listbox" aria-label="Commands">
        @if (results().length === 0) {
          <p class="palette__empty">No matches for &ldquo;{{ query() }}&rdquo;</p>
        }
        @for (item of results(); track item.id; let i = $index) {
          @if (i === 0 || results()[i - 1].group !== item.group) {
            <p class="palette__group">{{ item.group }}</p>
          }
          <button
            type="button"
            class="palette__item"
            role="option"
            tabindex="-1"
            [id]="'palette-' + item.id"
            [attr.aria-selected]="isActive(item)"
            [class.is-active]="isActive(item)"
            (mousemove)="setActive(i)"
            (click)="run(item)"
          >
            <span class="palette__item-icon" aria-hidden="true">
              <app-icon [name]="item.icon" [size]="16" />
            </span>
            <span class="palette__item-label">{{ item.label }}</span>
            <app-icon class="palette__item-enter" name="arrow-right" [size]="15" />
          </button>
        }
      </div>

      <div class="palette__foot">
        <span><kbd class="palette__kbd">↑</kbd><kbd class="palette__kbd">↓</kbd> navigate</span>
        <span><kbd class="palette__kbd">↵</kbd> run</span>
        <span class="palette__foot-brand">RK // COMMAND</span>
      </div>
    </div>
  </div>
}
