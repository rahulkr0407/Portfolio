@if (visible()) {
  <div class="intro scanlines" [class.is-closing]="closing()">
    <div class="intro__panel" [class.is-ready]="booted()" role="dialog" aria-modal="true" aria-labelledby="intro-title">
      <p class="intro__badge" aria-hidden="true">PORTFOLIO.SYS&nbsp;&middot;&nbsp;v6</p>

      <div class="intro__boot" aria-hidden="true">
        @for (line of bootLines; track line; let index = $index) {
          <p class="intro__boot-line" [class.is-visible]="bootCount() > index">
            {{ line }}
          </p>
        }
      </div>

      <div class="intro__reveal">
        <h1 id="intro-title" class="intro__title">RAHUL&nbsp;KUMAR</h1>
        <p class="intro__role">
          Frontend Developer<span class="intro__slash" aria-hidden="true">&nbsp;//&nbsp;</span>Tata Consultancy Services
        </p>

        <div class="intro__actions">
          <button type="button" class="btn btn--primary btn--lg intro__enter" data-intro-enter (click)="dismiss()">
            Enter the universe
            <app-icon name="arrow-right" [size]="18" />
          </button>
          <button type="button" class="intro__skip" data-intro-skip (click)="dismiss()">
            Skip
          </button>
        </div>

        <label class="intro__optout">
          <input type="checkbox" [checked]="optedOut()" (change)="toggleOptOut($event)" />
          <span>Don't show this again</span>
        </label>
      </div>
    </div>
  </div>
}
