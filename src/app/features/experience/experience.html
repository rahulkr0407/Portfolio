<section id="experience" class="section">
  <div class="container-page">
    <div appScrollReveal>
      <app-section-head
        eyebrow="02 · Experience"
        title="Where I've worked"
        lead="Building enterprise applications and shipping features in production."
      />
    </div>

    <div class="experience__list">
      @for (job of profile.experience; track job.company) {
        <article class="experience__card" appScrollReveal [appScrollRevealDelay]="80">
          <div class="experience__timeline" aria-hidden="true">
            <span class="experience__dot"></span>
            <span class="experience__line"></span>
          </div>

          <div class="experience__body">
            <div class="experience__head">
              <span class="experience__icon" aria-hidden="true">
                <app-icon name="building-2" [size]="20" />
              </span>
              <div>
                <h3 class="experience__role">{{ job.role }}</h3>
                <p class="experience__company">{{ job.company }}</p>
              </div>
            </div>

            <div class="experience__meta">
              <span class="chip experience__duration">
                <app-icon name="arrow-right" [size]="14" />
                {{ job.duration }}
              </span>
              <span class="experience__location">{{ job.location }}</span>
            </div>

            <ul class="experience__bullets">
              @for (bullet of job.bullets; track bullet) {
                <li class="experience__bullet">
                  <app-icon name="arrow-right" [size]="16" />
                  <span>{{ bullet }}</span>
                </li>
              }
            </ul>

            <ul class="experience__tags">
              @for (tech of job.technologies; track tech) {
                <li>
                  <span class="chip">{{ tech }}</span>
                </li>
              }
            </ul>
          </div>
        </article>
      }
    </div>
  </div>
</section>
