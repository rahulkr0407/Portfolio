@if (credentials().length > 0) {
  <section id="certifications" class="section grid-bg grid-bg--fade">
    <div class="container-page">
      <div appScrollReveal>
        <app-section-head
          eyebrow="07 · Credentials"
          title="Credentials"
          lead="Certifications and courses supporting my continued growth."
        />
      </div>

      <ul class="credentials__grid" appScrollReveal>
        @for (cert of credentials(); track cert.name) {
          <li class="card credentials__card hud-frame">
            <span class="credentials__icon" aria-hidden="true">
              <app-icon name="graduation-cap" [size]="20" />
            </span>
            <div class="credentials__body">
              <h3 class="credentials__name">{{ cert.name }}</h3>
              <p class="credentials__meta">
                {{ cert.issuer }} <span class="credentials__sep" aria-hidden="true">&middot;</span>
                <span class="credentials__year">{{ cert.year }}</span>
              </p>
            </div>
          </li>
        }
      </ul>
    </div>
  </section>
}
